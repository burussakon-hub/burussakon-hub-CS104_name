{% extends "base.html" %}

{% block title %}Edit Product - ShoeStore{% endblock %}

{% block content %}
<div class="row mb-5">
    <div class="col-md-8 mx-auto">
        <h1>Edit Product</h1>
        <p class="subtitle">Update product information</p>

        <hr>

        <!-- Form -->
        <form method="POST" action="/edit-shoe/{{ shoe['shoe_id'] }}">
            <div class="card border-0 mb-4">
                <div class="card-body">
                    <!-- Brand Field -->
                    <div class="mb-4">
                        <label for="brand_id" class="form-label">BRAND *</label>
                        <select class="form-select form-select-lg" id="brand_id" name="brand_id" required>
                            <option value="">Select Brand</option>
                            {% for brand in brands %}
                                <option value="{{ brand['brand_id'] }}"
                                        {% if brand['brand_id'] == shoe['brand_id'] %}selected{% endif %}>
                                    {{ brand['name'] }} - {{ brand['country'] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Model Field -->
                    <div class="mb-4">
                        <label for="model_name" class="form-label">MODEL NAME *</label>
                        <input type="text" class="form-control form-control-lg" id="model_name" name="model_name" 
                               value="{{ shoe['model_name'] }}" required>
                    </div>

                    <!-- Category Field -->
                    <div class="mb-4">
                        <label for="category" class="form-label">CATEGORY *</label>
                        <select class="form-select form-select-lg" id="category" name="category" required>
                            <option value="Casual" {% if shoe['category'] == 'Casual' %}selected{% endif %}>Casual</option>
                            <option value="Sports" {% if shoe['category'] == 'Sports' %}selected{% endif %}>Sports</option>
                            <option value="Running" {% if shoe['category'] == 'Running' %}selected{% endif %}>Running</option>
                            <option value="Basketball" {% if shoe['category'] == 'Basketball' %}selected{% endif %}>Basketball</option>
                            <option value="Walking" {% if shoe['category'] == 'Walking' %}selected{% endif %}>Walking</option>
                            <option value="Boots" {% if shoe['category'] == 'Boots' %}selected{% endif %}>Boots</option>
                            <option value="Sandals" {% if shoe['category'] == 'Sandals' %}selected{% endif %}>Sandals</option>
                        </select>
                    </div>

                    <!-- Image URL Field -->
                    <div class="mb-4">
                        <label for="image_url" class="form-label">IMAGE URL</label>
                        <input type="url" class="form-control form-control-lg" id="image_url" name="image_url"
                               value="{{ shoe['image_url'] }}" placeholder="https://example.com/shoe-image.jpg">
                        <div class="form-text text-white-50">ใส่ URL รูปภาพเพื่อแสดงในรายการสินค้า</div>
                    </div>

                    <!-- Price Field -->
                    <div class="mb-4">
                        <label for="base_price" class="form-label">BASE PRICE (BAHT) *</label>
                        <input type="number" class="form-control form-control-lg" id="base_price" name="base_price" 
                               value="{{ shoe['base_price'] }}" step="0.01" min="0" required>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-3 mt-5">
                <button type="submit" class="btn btn-warning btn-lg flex-grow-1">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="/shoes" class="btn btn-secondary btn-lg">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>

        <!-- Info -->
        <div style="margin-top: 2rem; padding: 1rem; background: rgba(255, 107, 53, 0.1); border-left: 3px solid #ff6b35;">
            <p style="margin: 0; color: #ff6b35;">
                <strong>Product ID:</strong> {{ shoe['shoe_id'] }}
            </p>
        </div>
    </div>
</div>

{% endblock %}
