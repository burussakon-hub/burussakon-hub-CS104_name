{% extends "base.html" %}

{% block title %}Error {{ error_code }} - Shoe Store{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto text-center">
        <div class="mt-5">
            <!-- ไอคอน Error -->
            <h1 class="display-1 text-danger mb-3">❌</h1>
            
            <!-- รหัสข้อผิดพลาด -->
            <h2 class="mb-3">Error {{ error_code }}</h2>
            
            <!-- ข้อความข้อผิดพลาด -->
            <p class="lead text-muted">{{ error_message }}</p>
            
            <!-- ลิงก์กลับไป Dashboard -->
            <div class="mt-4">
                <a href="/" class="btn btn-primary btn-lg">
                    ← กลับไปยัง Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
