{% extends "base.html" %}

{% block title %}แก้ไขรองเท้า - Shoe Store{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h1>✏️ แก้ไขข้อมูลรองเท้า</h1>
        <hr>

        <!-- ฟอร์มแก้ไขรองเท้า -->
        <form method="POST" action="/edit-shoe/{{ shoe['shoe_id'] }}">
            <!-- ฟิลด์: เลือกแบรนด์ -->
            <div class="mb-3">
                <label for="brand_id" class="form-label">
                    <strong>แบรนด์ *</strong>
                </label>
                <select class="form-select" id="brand_id" name="brand_id" required>
                    <option value="">-- เลือกแบรนด์ --</option>
                    {% for brand in brands %}
                        <option value="{{ brand['brand_id'] }}"
                                {% if brand['brand_id'] == shoe['brand_id'] %}selected{% endif %}>
                            {{ brand['name'] }} ({{ brand['country'] }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- ฟิลด์: ชื่อรุ่น -->
            <div class="mb-3">
                <label for="model_name" class="form-label">
                    <strong>ชื่อรุ่น *</strong>
                </label>
                <input type="text" class="form-control" id="model_name" name="model_name" 
                       value="{{ shoe['model_name'] }}" required>
            </div>

            <!-- ฟิลด์: หมวดหมู่ -->
            <div class="mb-3">
                <label for="category" class="form-label">
                    <strong>หมวดหมู่ *</strong>
                </label>
                <select class="form-select" id="category" name="category" required>
                    <option value="Casual" {% if shoe['category'] == 'Casual' %}selected{% endif %}>
                        Casual
                    </option>
                    <option value="Sports" {% if shoe['category'] == 'Sports' %}selected{% endif %}>
                        Sports
                    </option>
                    <option value="Running" {% if shoe['category'] == 'Running' %}selected{% endif %}>
                        Running
                    </option>
                    <option value="Basketball" {% if shoe['category'] == 'Basketball' %}selected{% endif %}>
                        Basketball
                    </option>
                    <option value="Walking" {% if shoe['category'] == 'Walking' %}selected{% endif %}>
                        Walking
                    </option>
                    <option value="Boots" {% if shoe['category'] == 'Boots' %}selected{% endif %}>
                        Boots
                    </option>
                    <option value="Sandals" {% if shoe['category'] == 'Sandals' %}selected{% endif %}>
                        Sandals
                    </option>
                </select>
            </div>

            <!-- ฟิลด์: ราคา -->
            <div class="mb-3">
                <label for="base_price" class="form-label">
                    <strong>ราคาฐาน (บาท) *</strong>
                </label>
                <input type="number" class="form-control" id="base_price" name="base_price" 
                       value="{{ shoe['base_price'] }}" step="0.01" min="0" required>
            </div>

            <hr>

            <!-- ปุ่มบันทึก และ ยกเลิก -->
            <div class="mb-3">
                <button type="submit" class="btn btn-warning btn-lg">
                    💾 บันทึกการเปลี่ยนแปลง
                </button>
                <a href="/shoes" class="btn btn-secondary btn-lg ms-2">
                    ✕ ยกเลิก
                </a>
            </div>
        </form>

        <!-- ข้อมูลเพิ่มเติม -->
        <div class="alert alert-secondary mt-3">
            <strong>ID รองเท้า:</strong> {{ shoe['shoe_id'] }}
        </div>
    </div>
</div>

{% endblock %}
