{% extends "base.html" %}

{% block title %}Add Product - ShoeStore{% endblock %}

{% block content %}
<div class="row mb-5">
    <div class="col-md-8 mx-auto">
        <h1>Add New Product</h1>
        <p class="subtitle">Expand your shoe collection</p>

        <hr>

        <!-- Form -->
        <form method="POST" action="/add-shoe">
            <div class="card border-0 mb-4">
                <div class="card-body">
                    <!-- Brand Field -->
                    <div class="mb-4">
                        <label for="brand_id" class="form-label">BRAND *</label>
                        <select class="form-select form-select-lg" id="brand_id" name="brand_id" required>
                            <option value="">Select Brand</option>
                            {% for brand in brands %}
                                <option value="{{ brand['brand_id'] }}">
                                    {{ brand['name'] }} - {{ brand['country'] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Model Field -->
                    <div class="mb-4">
                        <label for="model_name" class="form-label">MODEL NAME *</label>
                        <input type="text" class="form-control form-control-lg" id="model_name" name="model_name" 
                               placeholder="e.g., Air Force 1" required>
                    </div>

                    <!-- Category Field -->
                    <div class="mb-4">
                        <label for="category" class="form-label">CATEGORY *</label>
                        <select class="form-select form-select-lg" id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Casual">Casual</option>
                            <option value="Sports">Sports</option>
                            <option value="Running">Running</option>
                            <option value="Basketball">Basketball</option>
                            <option value="Walking">Walking</option>
                            <option value="Boots">Boots</option>
                            <option value="Sandals">Sandals</option>
                        </select>
                    </div>

                    <!-- Price Field -->
                    <div class="mb-4">
                        <label for="base_price" class="form-label">BASE PRICE (BAHT) *</label>
                        <input type="number" class="form-control form-control-lg" id="base_price" name="base_price" 
                               placeholder="3000" step="0.01" min="0" required>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-3 mt-5">
                <button type="submit" class="btn btn-success btn-lg flex-grow-1">
                    <i class="fas fa-plus"></i> Add Product
                </button>
                <a href="/shoes" class="btn btn-secondary btn-lg">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
